<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tour virtual — demo</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0a0f1a;
        color: #93a1b3;
        font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
        background-image: radial-gradient(40rem 26rem at 50% 30%, rgb(0 229 255 / 0.08), transparent 70%);
      }
      .wrap { text-align: center; padding: 2rem; }
      h1 { font-size: 1rem; letter-spacing: 0.3em; color: #00e5ff; margin-bottom: 1rem; }
      p { font-size: 0.8rem; letter-spacing: 0.15em; }
      .grid {
        margin: 2rem auto 0;
        width: min(560px, 100%);
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1px;
        background: #1e2a3a;
        border: 1px solid #1e2a3a;
      }
      .grid i {
        aspect-ratio: 1;
        background: #0d1422;
        font-style: normal;
        display: grid;
        place-items: center;
        color: #1e2a3a;
        font-size: 1.4rem;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1>RECORRIDO VIRTUAL · DEMO</h1>
      <p>El visor krpano real se integrará aquí en la Fase 6.</p>
      <div class="grid" aria-hidden="true">
        <i>+</i><i>+</i><i>+</i><i>+</i><i>+</i><i>+</i><i>+</i><i>+</i><i>+</i>
      </div>
    </main>
  </body>
</html>
